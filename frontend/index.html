<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 · 多模态作品管理</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' text-anchor='middle' fill='white'%3E作%3C/text%3E%3C/svg%3E"
  >
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">作品集</h1>
    <span class="topbar__hint">AI 作品管理 · 本地版</span>
    <button id="btn-settings" type="button" class="btn btn--ghost topbar__settings">设置</button>
  </header>

  <main class="layout">
    <!-- ===== 左栏：作品列表 ===== -->
    <aside class="panel panel--list">
      <div class="panel__head">
        <h2 class="panel__title">作品</h2>
        <button id="btn-new" type="button" class="btn btn--primary">+ 新增</button>
      </div>

      <!-- 按 type 筛选。data-type 与后端 works.type 取值一致 -->
      <nav class="filters" id="filters">
        <button type="button" class="chip chip--active" data-type="all">全部</button>
        <button type="button" class="chip" data-type="video">视频</button>
        <button type="button" class="chip" data-type="image">图片</button>
        <button type="button" class="chip" data-type="text">文本</button>
        <button type="button" class="chip" data-type="code">代码</button>
        <button type="button" class="chip" data-type="project">项目</button>
      </nav>

      <!-- 列表由 app.js 渲染，每个 li 内含标题 / 类型 / 标签 / 编辑按钮 -->
      <ul class="work-list" id="work-list"></ul>
      <p class="empty" id="work-empty">还没有作品，点右上角「新增」开始。</p>
    </aside>

    <!-- ===== 右栏：对话区 ===== -->
    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">对话</h2>
      </div>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <input id="question" type="text" autocomplete="off" maxlength="500">
        <button type="submit" class="btn btn--primary">发送</button>
      </form>
    </section>
  </main>

  <!-- ===== 新增 / 编辑作品弹窗（同一套表单，靠 work-id 区分） ===== -->
  <dialog class="modal" id="work-modal">
    <form class="modal__body" id="work-form">
      <h2 class="modal__title" id="modal-title">新增作品</h2>
      <input type="hidden" id="work-id">

      <label class="field">
        <span class="field__label">标题 <span class="field__note">拖了文件可留空，自动取文件名</span></span>
        <input id="work-title" type="text" maxlength="120">
      </label>

      <label class="field">
        <span class="field__label">类型</span>
        <select id="work-type">
          <option value="text">文本</option>
          <option value="video">视频</option>
          <option value="image">图片</option>
          <option value="code">代码</option>
          <option value="project">项目</option>
        </select>
      </label>

      <div class="field" id="field-content">
        <span class="field__label" id="content-label">内容</span>
        <textarea id="work-content" rows="5"></textarea>
      </div>

      <!-- 新增时：拖拽区 + 文件选择。浏览器拿不到本地绝对路径，
           所以只能把文件本体传上来（后端落到 media/ 再解析） -->
      <div class="field" id="field-files" hidden>
        <span class="field__label">文件（拖进来或点击选择，可多选）</span>
        <div class="dropzone" id="dropzone" role="button" tabindex="0">
          <span class="dropzone__plus">+</span>
          <span class="dropzone__main">拖文件到这里，或点击选择</span>
          <span class="dropzone__sub">图片自动生成描述 · PDF/Word/Excel/代码自动解析正文 · 视频只存元数据</span>
        </div>
        <input id="work-file" type="file" multiple hidden>
        <ul class="filelist" id="filelist"></ul>
      </div>

      <div class="field" id="field-cover" hidden>
        <span class="field__label">视频封面（可选，会生成一句画面描述）</span>
        <div class="dropzone dropzone--sm" id="dropzone-cover" role="button" tabindex="0">
          <span class="dropzone__main">点击选择封面图片</span>
        </div>
        <input id="work-cover" type="file" accept="image/*" hidden>
        <ul class="filelist" id="coverlist"></ul>
      </div>

      <label class="field">
        <span class="field__label">标签</span>
        <input id="work-tags" type="text" placeholder="用逗号分隔，如：明史, 分镜">
      </label>

      <div class="modal__actions">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn--primary" id="btn-save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- ===== 设置弹窗：打包版没有 .env 文件，密钥在这里填 ===== -->
  <dialog class="modal" id="settings-modal">
    <form class="modal__body" id="settings-form">
      <h2 class="modal__title">设置</h2>
      <p class="modal__note" id="settings-note">
        填一次就行。密钥只保存在这台电脑上，不会上传到任何地方。
      </p>

      <label class="field">
        <span class="field__label">DeepSeek 密钥 <span class="field__note">对话要用</span></span>
        <input id="key-deepseek" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </label>

      <label class="field">
        <span class="field__label">硅基流动密钥 <span class="field__note">检索要用（能把作品搜出来）</span></span>
        <input id="key-embedding" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </label>

      <label class="field">
        <span class="field__label">视觉模型密钥 <span class="field__note">图片自动描述要用，可不填</span></span>
        <input id="key-gpt" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </label>

      <ul class="probe" id="probe-results" hidden></ul>

      <p class="modal__note" id="settings-storage"></p>

      <div class="modal__actions">
        <button type="button" class="btn" id="btn-quit" hidden>退出程序</button>
        <button type="button" class="btn" id="btn-settings-test">测试连接</button>
        <button type="button" class="btn" id="btn-settings-close">关闭</button>
        <button type="submit" class="btn btn--primary" id="btn-settings-save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- ===== 作品卡片模板：JS 直接 clone，避免手拼 HTML 字符串 ===== -->
  <template id="tpl-work">
    <li class="work-card">
      <div class="work-card__head">
        <span class="badge"></span>
        <time class="work-card__date"></time>
      </div>
      <h3 class="work-card__title"></h3>
      <p class="work-card__excerpt"></p>
      <div class="work-card__foot">
        <ul class="work-card__tags"></ul>
        <div class="work-card__actions">
          <button type="button" class="btn btn--ghost work-card__edit">编辑</button>
          <button type="button" class="btn btn--ghost work-card__del">删除</button>
        </div>
      </div>
    </li>
  </template>

  <!-- ===== 消息气泡模板 ===== -->
  <template id="tpl-message">
    <div class="msg">
      <div class="msg__bubble"></div>
    </div>
  </template>

  <script src="app.js?v=4"></script>
</body>
</html>
