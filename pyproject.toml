[project]
name = "portfolio-hub"
version = "0.1.0"
description = "将作品归纳汇总成可检索、可自然语言管理的多模态作品集"
readme = "README.md"
authors = [
    { name = "Jeno_Ra", email = "jenora001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "openai>=3.45.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.1.6",
    "striprtf>=0.0.35",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# 让 `uv run pytest` 从项目根导入 backend 包（否则 ModuleNotFoundError: backend）
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff.lint]
# B008：FastAPI 的 `db: Session = Depends(get_db)` 是官方标准写法，
# 但 bugbear 规则会误报。关掉这一条，而不是给 8 个路由逐个加 noqa。
extend-ignore = ["B008"]
