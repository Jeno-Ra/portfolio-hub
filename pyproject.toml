[project]
name = "portfolio-hub"
version = "0.1.0"
description = "将作品归纳汇总成可检索、可自然语言管理的多模态作品集"
readme = "README.md"
authors = [
    { name = "Jeno_Ra", email = "jenora001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "openai>=3.45.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# 让 `uv run pytest` 从项目根导入 backend 包（否则 ModuleNotFoundError: backend）
pythonpath = ["."]
testpaths = ["backend/tests"]
