# ============================================================
# PortfolioHub 三服务编排
#
#   backend  ← 应用（FastAPI）
#   postgres ← 关系库（作品、切片、会话）
#   chroma   ← 向量库（片段向量）
#
# 几个刻意的决定：
#   1. postgres / chroma 不映射宿主机端口：只有 backend 需要对外，
#      少暴露一个端口就少一个被扫的风险，也不会和 RAGFlow 抢 5432。
#   2. depends_on + condition: service_healthy：等数据库真的能连再启后端，
#      只写 depends_on 只保证"容器启动了"，那时 Postgres 还没准备好接受连接。
#   3. 数据全部走命名卷：docker compose down 不会删卷，重建容器数据还在。
#   4. restart: "no"：本项目的容器由你手动启停（和 RAGFlow 一样），
#      避免开机时两个项目一起抢那 4 GB 内存。
# ============================================================

name: portfolio

services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: portfolio-hub:0.2
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的默认值：数据落到挂载卷，而不是镜像内部
      DB_PATH: /app/data/portfolio_hub.db
      # 浏览器上传的原件也放卷里，重建容器不丢（否则 media/ 会随镜像一起被替换）
      MEDIA_DIR: /app/data/media
      # 关系库指向 postgres 服务（服务名即主机名）。
      # 密码与下面 postgres 的 POSTGRES_PASSWORD 读同一个变量，避免写死两处。
      DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD:-portfolio_dev_password}@postgres:5432/portfolio
      # 向量库指向 chroma 服务（服务端模式），不再用容器内的嵌入式库
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      # 容器默认 UTC，日志里的 ts 会差 8 小时；设成东八区，和手机/电脑对得上
      TZ: Asia/Shanghai
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        # chroma 官镜像是最小化的（只有 chroma 二进制，没有 python/curl/wget），
        # 写不了 shell 探活，所以这里只等"容器启动"；
        # 真正的就绪判断在 backend 的 vector_store._build_client() 里：
        # 30 次 × 1 秒的 heartbeat 重试，超时才报错，比 shell 探活更可靠。
        condition: service_started
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev_password}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 没有这条，depends_on 就只是"容器起来了"，不是"能连了"
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: portfolio-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/data
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    ports:
      # 80 是"短地址"：手机浏览器只敲 http://100.x.x.x/ 就行。
      # 注意 RAGFlow 那套也占 80，两者不能同时开。
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: "no"

volumes:
  appdata:
  pgdata:
  chromadata:
