# 反向代理：把 80 端口接到 backend:8000。
#
# 为什么需要它：8000 是个"开发端口号"，手机浏览器里要敲 :8000；
# 走 80 就只需要 http://100.x.x.x/。另外反代是一层统一入口，
# 以后要加 HTTPS、限流、访问日志都在这里做，不用改应用。

server {
    listen 80;
    server_name _;

    # 拖拽上传最大 512 MB（和后端 uploads.MAX_BYTES 对齐）。
    # 默认只有 1 MB，上传几 MB 的视频会直接 413，这是最容易踩的坑。
    client_max_body_size 512m;

    # 延迟发送，避免大文件先全读进内存
    proxy_request_buffering off;

    location / {
        # 用变量而不是写死 http://backend:8000：
        # 写死时 nginx 启动那一刻就要解析 backend 的 DNS，后端没起会直接启动失败；
        # 用变量 + resolver 把解析推迟到每次请求，后端晚起也能自愈。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 Connection: close，让 nginx 和后端之间复用长连接
        proxy_set_header Connection "";

        # SSE 必须关缓冲：默认 nginx 会攒够一个 buffer 才转发，
        # 流式回答就会变成"憋几秒然后整段蹦出来"。
        proxy_buffering off;
        proxy_cache off;

        # 一次问答最长可能到 30 秒（llm 总预算），读超时要留够
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
