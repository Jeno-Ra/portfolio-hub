name: CI

# 什么时候跑：
# - push 到 main（保证主干永远绿）
# - 任何 PR（避免没跑测试就合）
# - 支持手动触发，方便调试
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连着推两次时，取消上一次还在跑的任务，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（带依赖缓存）
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --frozen：严格按 uv.lock 装，锁文件和 pyproject 不一致就直接失败，
      # 避免「本地能跑、CI 装了另一个版本」这种最难查的问题
      - name: 安装依赖
        run: uv sync --frozen

      - name: 静态检查
        run: uv run ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（带依赖缓存）
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # 测试全程不联网：embedding / LLM / 向量库都是假实现，
      # 数据库与上传目录指向临时目录，所以 CI 里不需要任何密钥
      - name: 跑测试
        run: uv run pytest -q
